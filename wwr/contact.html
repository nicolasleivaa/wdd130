<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact White Water Rafting — reach our team for reservations, general inquiries, or questions about our river adventures.">
  <meta name="author" content="Nicolás Leiva">
  <title>Contact Us | White Water Rafting</title>
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>

<header>
  <img src="images/logo.png" alt="White Water Rafting Logo" width="120">
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="trips.html">Trips</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </nav>
</header>

<main>

  <!-- COMPANY INFO + MAP -->
  <section class="contact-info">
    <div class="contact-details">
      <h2>Get In Touch</h2>
      <p><strong>Address:</strong> 123 River Road, Adventure City</p>
      <p><strong>Phone:</strong> (123) 456-7890</p>
      <p><strong>Email:</strong> info@whitewaterrafting.com</p>
    </div>
    <div class="contact-map">
      <h2>Our Location</h2>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.6!2d-73.9857!3d40.7484!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c259a9b3117469%3A0xd134e199a405a163!2sEmpire%20State%20Building!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
        width="380"
        height="250"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        title="White Water Rafting Company Location">
      </iframe>
    </div>
  </section>

  <!-- EMPLOYEE PROFILES -->
  <section class="team">
    <h2>Meet Our Team</h2>
    <div class="team-grid">

      <figure>
        <img src="https://images.unsplash.com/photo-1564564321837-a57b7070ac4f?w=300&h=300&fit=crop&crop=face" alt="John, Lead River Guide">
        <figcaption>John – Lead River Guide</figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=300&h=300&fit=crop&crop=face" alt="Sarah, Safety Instructor">
        <figcaption>Sarah – Safety Instructor</figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=300&h=300&fit=crop&crop=face" alt="Mike, Expedition Leader">
        <figcaption>Mike – Expedition Leader</figcaption>
      </figure>

    </div>
  </section>

  <!-- CONTACT FORM -->
  <section class="contact-form">
    <h2>Send Us a Message</h2>
    <form action="#" method="get">

      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="full_name" placeholder="Your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <fieldset>
          <legend>Purpose of Message</legend>
          <label class="radio-label">
            <input type="radio" name="purpose" value="general" required>
            General Inquiry
          </label>
          <label class="radio-label">
            <input type="radio" name="purpose" value="reservation">
            Reservation Question
          </label>
          <label class="radio-label">
            <input type="radio" name="purpose" value="website">
            Website Suggestion
          </label>
        </fieldset>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Write your message here..."></textarea>
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" name="newsletter" value="yes">
          Please subscribe me to the monthly newsletter
        </label>
      </div>

      <button type="submit">Send Message</button>

    </form>
  </section>

</main>

<footer>
  <p>© 2026 White Water Rafting | Nicolás Leiva</p>
  <nav class="socialmedia">
    <a href="https://facebook.com">
      <img src="images/facebook.svg" alt="Facebook">
    </a>
    <a href="https://instagram.com">
      <img src="images/instagram.svg" alt="Instagram">
    </a>
    <a href="https://twitter.com">
      <img src="images/x.svg" alt="Twitter">
    </a>
  </nav>
</footer>

</body>
</html>
