<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact White Water Rafting for reservations, questions, or adventure information.">
  <meta name="author" content="Nicolás Leiva">
  <title>Contact Us | White Water Rafting</title>
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

<header>
  <img src="images/logo.png" alt="White Water Rafting Logo" width="120">

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="trips.html">Trips</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </nav>
</header>

<main>

  <section class="contact-info">
    <h1>Contact Us</h1>

    <p><strong>Address:</strong> 123 River Road, Adventure City</p>
    <p><strong>Phone:</strong> (123) 456-7890</p>
    <p><strong>Email:</strong> info@whitewaterrafting.com</p>

    <h2>Our Location</h2>

    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.0193784217436!2d-122.41941518468169!3d37.77492977975978!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c5f9bcd1b%3A0x4f4f3f3f3f3f3f3f!2sSan%20Francisco!5e0!3m2!1sen!2sus!4v1616175847423"
      width="600"
      height="450"
      loading="lazy"
      allowfullscreen>
    </iframe>
  </section>

  <section class="employees">
    <h2>Meet Our Team</h2>

    <figure>
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=400&q=80" alt="River Guide Leading Raft">
      <figcaption>John – Lead River Guide</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1528731708534-816fe59f90a5?auto=format&fit=crop&w=400&q=80" alt="Rafting Safety Instructor">
      <figcaption>Sarah – Safety Instructor</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=400&q=80" alt="Rafting Team Leader on River">
      <figcaption>Mike – Expedition Leader</figcaption>
    </figure>

  </section>

  <section class="contact-form">
    <h2>Send Us a Message</h2>

    <form>
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <p>Purpose of Message:</p>

      <label>
        <input type="radio" name="purpose" value="general" required>
        General Inquiry
      </label>

      <label>
        <input type="radio" name="purpose" value="reservation">
        Reservation Question
      </label>

      <label>
        <input type="radio" name="purpose" value="suggestion">
        Website Suggestion
      </label>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5"></textarea>

      <label>
        <input type="checkbox" name="newsletter">
        Please subscribe me to the monthly newsletter
      </label>

      <button type="submit">Send Message</button>
    </form>
  </section>

</main>

<footer>
  <p>© 2026 White Water Rafting | Nicolás Leiva</p>

  <nav class="socialmedia">
    <a href="https://facebook.com">
      <img src="images/facebook.svg" alt="Facebook">
    </a>
    <a href="https://instagram.com">
      <img src="images/instagram.svg" alt="Instagram">
    </a>
    <a href="https://twitter.com">
      <img src="images/x.svg" alt="Twitter">
    </a>
  </nav>
</footer>

</body>
</html>
